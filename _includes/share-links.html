{% assign share_url = page.url | absolute_url %}
<div class="share-links" aria-label="Del opskrift">
    <span>Del:</span>
    <a href="https://twitter.com/intent/tweet?url={{ share_url | uri_escape }}&text={{ page.title | uri_escape }}"
        target="_blank" rel="noopener">Twitter</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url | uri_escape }}" target="_blank"
        rel="noopener">Facebook</a>
    <a href="https://www.pinterest.com/pin/create/button/?url={{ share_url | uri_escape }}&description={{ page.title | uri_escape }}"
        target="_blank" rel="noopener">Pinterest</a>
</div>
